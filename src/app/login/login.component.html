<div class="login-container">
  <div class="login-card">
    <!-- Header com logo centralizada -->
    <div class="login-header">
      <img src="assets/brand/logo-horizontal-256w.png" alt="Geo7" class="login-logo">
    </div>

    <!-- Card principal do formulário -->
    <mat-card class="login-form-card">
      <mat-card-header class="form-header">
        <h1 class="login-title">Entrar no Sistema</h1>
        <p class="login-subtitle">Faça login para acessar o Geo7</p>
      </mat-card-header>

      <mat-card-content class="login-content">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
          <!-- Email Field -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input 
              matInput 
              type="email" 
              formControlName="email"
              placeholder="seu@email.com"
              autocomplete="email">
            <mat-icon matSuffix>email</mat-icon>
            <mat-error *ngIf="isFieldInvalid('email')">
              {{ getErrorMessage('email') }}
            </mat-error>
          </mat-form-field>

          <!-- Password Field -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Senha</mat-label>
            <input 
              matInput 
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="Digite sua senha"
              autocomplete="current-password">
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="hidePassword = !hidePassword"
              [attr.aria-label]="'Ocultar senha'"
              [attr.aria-pressed]="hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="isFieldInvalid('password')">
              {{ getErrorMessage('password') }}
            </mat-error>
          </mat-form-field>

          <!-- Submit Button -->
          <button 
            mat-raised-button 
            color="primary" 
            type="submit"
            class="login-button full-width"
            [disabled]="isLoading || loginForm.invalid">
            <mat-spinner 
              *ngIf="isLoading" 
              diameter="20" 
              class="button-spinner">
            </mat-spinner>
            <span *ngIf="!isLoading">
              <mat-icon>login</mat-icon>
              Entrar
            </span>
            <span *ngIf="isLoading">Entrando...</span>
          </button>
        </form>

        <mat-divider class="login-divider"></mat-divider>

        <!-- Back to Landing Button -->
        <button 
          mat-stroked-button 
          color="primary" 
          class="back-button full-width"
          (click)="voltarParaLanding()"
          [disabled]="isLoading">
          <mat-icon>arrow_back</mat-icon>
          Voltar para Página Inicial
        </button>
      </mat-card-content>
    </mat-card>

</div>
