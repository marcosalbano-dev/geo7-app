<div [formGroup]="form">
    <div fxLayout="row" fxLayoutGap="16px">
      <div fxFlex="330px">
        <mat-form-field class="full-width">
          <mat-label>Forma de obtenção</mat-label>
          <mat-select formControlName="formaObtencaoSelecionada">
            <mat-option *ngFor="let fo of obtencoes" [value]="fo.value">
              {{ fo.viewValue }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div fxFlex="200px">
        <mat-form-field class="full-width">
          <mat-label>Ofício</mat-label>
          <input matInput formControlName="oficio" />
        </mat-form-field>
      </div>
      <div fxFlex="150px">
        <mat-form-field class="full-width">
          <mat-label>Matrícula</mat-label>
          <input matInput formControlName="matricula" />
        </mat-form-field>
      </div>
      <div fxFlex="150px">
        <mat-form-field class="full-width">
          <mat-label>Livro</mat-label>
          <input matInput formControlName="livro" />
        </mat-form-field>
      </div>
    </div>
  
    <div fxLayout="row" fxLayoutGap="16px">
      <div fxFlex="250px">
        <mat-form-field class="full-width">
          <mat-label>Nome do Cartório</mat-label>
          <input matInput formControlName="nomeCartorio" />
        </mat-form-field>
      </div>
      <div fxFlex="200px">
        <mat-form-field class="full-width">
          <mat-label>Município do Cartório</mat-label>
          <input matInput formControlName="municipioCartorio" />
        </mat-form-field>
      </div>
      <div fxFlex="150px">
        <mat-form-field class="full-width">
          <mat-label>Data Registro</mat-label>
          <input
            matInput
            [matDatepicker]="picker"
            formControlName="dataRegistro"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      <div fxFlex="120px">
        <mat-form-field class="full-width">
          <mat-label>Nº Registro</mat-label>
          <input matInput formControlName="numeroRegistro" />
        </mat-form-field>
      </div>
    </div>
  
    <div fxLayout="row" fxLayoutGap="16px">
      <div fxFlex="150px">
        <mat-form-field class="full-width">
          <mat-label>Área Registrada (ha)</mat-label>
          <input matInput type="number" formControlName="areaRegistrada" />
        </mat-form-field>
      </div>
      <div fxFlex="150px">
        <mat-form-field class="full-width">
          <mat-label>Área Medida (ha)</mat-label>
          <input matInput type="number" formControlName="areaMedida" />
        </mat-form-field>
      </div>
      <div fxFlex="150px">
        <mat-form-field class="full-width">
          <mat-label>Nº Herdeiros</mat-label>
          <input matInput type="number" formControlName="numeroHerdeiros" />
        </mat-form-field>
      </div>
      <div fxFlex="180px">
        <mat-form-field class="full-width">
          <mat-label>Data da Posse</mat-label>
          <input matInput formControlName="dataPosse" type="date" />
        </mat-form-field>
      </div>
    </div>
  </div>
