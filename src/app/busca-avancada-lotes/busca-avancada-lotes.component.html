<h2 mat-dialog-title>PESQUISA DE IMÓVEIS E DETENTORES</h2>
<form [formGroup]="buscaForm">
  <mat-dialog-content>
    <div fxLayout="row" fxLayoutGap="16px">
      <mat-form-field>
        <mat-label>CPF</mat-label>
        <input matInput formControlName="cpf" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Nome do Detentor</mat-label>
        <input matInput formControlName="proprietario" />
      </mat-form-field>
    </div>
    <div fxLayout="row" fxLayoutGap="16px" class="mt-10">
      <mat-form-field>
        <mat-label>Município</mat-label>
        <mat-select formControlName="municipio">
          <mat-option
            *ngFor="let municipio of data.municipios"
            [value]="municipio.id"
          >
            {{ municipio.nome }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Número</mat-label>
        <input matInput formControlName="numero" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Denominação do Imóvel</mat-label>
        <input matInput formControlName="denominacao" />
      </mat-form-field>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button color="warn" (click)="fechar()">Fechar</button>
    <button mat-stroked-button color="primary" (click)="reset()">Reset</button>
    <button mat-flat-button color="primary" (click)="buscar()">Buscar</button>
  </mat-dialog-actions>
</form>
