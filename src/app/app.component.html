<mat-sidenav-container class="main-container page" *ngIf="showFullLayout; else landingLayout">
  <!-- Drawer / menu lateral -->
  <mat-sidenav #drawer class="sidenav" [mode]="(isHandset$ | async) ? 'over' : 'side'" [opened]="!(isHandset$ | async)">

    <div class="sidenav-header">
      <img src="assets/brand/logo-horizontal-256w.png" alt="Geo7" class="sidenav-logo">
    </div>

    <mat-nav-list>
      <!-- <a mat-list-item routerLink="/cadastro-lotes" (click)="closeIfHandset(drawer)">
        <mat-icon>home</mat-icon>
        <span class="ml-5">Imóveis</span>
      </a>
      <a mat-list-item routerLink="/cadastro-estrutura" (click)="closeIfHandset(drawer)">
        <mat-icon>settings</mat-icon><span class="ml-5">Estrutura</span>
      </a>
      <a mat-list-item routerLink="/cadastro-pessoas" (click)="closeIfHandset(drawer)">
        <mat-icon>person</mat-icon><span class="ml-5">Dados Pessoais</span>
      </a>
      <a mat-list-item routerLink="/cadastro-endereco-lote" (click)="closeIfHandset(drawer)">
        <mat-icon>place</mat-icon><span class="ml-5">Endereço do Imóvel</span>
      </a>
      <a mat-list-item routerLink="/cadastro-dados-sobre-uso" (click)="closeIfHandset(drawer)">
        <mat-icon>eco</mat-icon><span class="ml-5">Dados Sobre Uso</span>
      </a> -->
      <a mat-list-item routerLink="/consulta-lotes" (click)="closeIfHandset(drawer)">
        <mat-icon>search</mat-icon><span class="ml-5">Consulta</span>
      </a>
      <span class="spacer"></span>
      <a mat-list-item routerLink="/cadastro-usuario" (click)="closeIfHandset(drawer)" *ngIf="isAdmin()">
        <mat-icon>person_add</mat-icon><span class="ml-5">Cadastrar Usuário</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Conteúdo -->
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <mat-toolbar-row class="toolbar-row-1">
        <button mat-icon-button class="hide-on-large" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <img src="assets/brand/logo-horizontal-256w.png" alt="Geo7" class="brand">
        <span class="spacer"></span>
        
        <!-- Botão de logout -->
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name hide-on-small">{{ getShortUserName() }}</span>
        </button>
        
        <mat-menu #userMenu="matMenu">
          <div class="user-info">
            <div class="user-name-full">{{ getCurrentUser()?.name || 'Usuário' }}</div>
            <div class="user-role">{{ getCurrentUser()?.role || 'USER' }}</div>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item>
            <mat-icon>person</mat-icon>
            <span>Perfil</span>
          </button>
          <button mat-menu-item>
            <mat-icon>settings</mat-icon>
            <span>Configurações</span>
          </button>
          <button mat-menu-item routerLink="/cadastro-usuario" *ngIf="isAdmin()">
            <mat-icon>person_add</mat-icon>
            <span>Cadastrar Usuário</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </mat-toolbar-row>

      <!-- Linha 2: links (somente em telas grandes) -->
      <mat-toolbar-row class="toolbar-row-2" *ngIf="!(isHandset$ | async)">
        <!-- Links condicionais: mostram apenas quando há município selecionado -->
        <ng-container *ngIf="showNavigationLinks$ | async">
          <a mat-button [routerLink]="['/cadastro-lotes']" [queryParams]="getQueryParams()">
            <mat-icon>home</mat-icon><span class="ml-5">Imóveis</span>
          </a>
          <a mat-button [routerLink]="['/cadastro-estrutura']" [queryParams]="getQueryParams()">
            <mat-icon>settings</mat-icon><span class="ml-5">Estrutura</span>
          </a>
          <a mat-button [routerLink]="['/cadastro-pessoas']" [queryParams]="getQueryParams()">
            <mat-icon>person</mat-icon><span class="ml-5">Dados Pessoais</span>
          </a>
          <a mat-button [routerLink]="['/cadastro-dados-sobre-uso']" [queryParams]="getQueryParams()">
            <mat-icon>eco</mat-icon><span class="ml-5">Dados Sobre Uso</span>
          </a>
        </ng-container>
        <!-- Link de Consulta sempre visível -->
        <a mat-button routerLink="/consulta-lotes">
          <mat-icon>search</mat-icon><span class="ml-5">Consulta</span>
        </a>
      </mat-toolbar-row>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Layout simples para landingpage e login -->
<ng-template #landingLayout>
  <div class="landing-layout">
    <router-outlet></router-outlet>
  </div>
</ng-template>
