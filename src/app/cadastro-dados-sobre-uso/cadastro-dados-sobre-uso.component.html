<!-- dados-sobre-uso.component.html (novo, sem fxLayout) -->
<div class="page">
  <form [formGroup]="formDadosSobreUso" (ngSubmit)="atualizando ? onAtualizar() : onSalvar()">

         <!-- Botão Voltar -->
         <div class="back-button-container mb-20">
          <app-back-button 
            text="Voltar" 
            (backClick)="onVoltarClick()"
            [useHistory]="false">
          </app-back-button>
        </div>
    <mat-card appearance="outlined" class="card">
      <mat-card-header>
        <mat-card-title>Quadro de Áreas de Uso</mat-card-title>
      </mat-card-header>

      <mat-card-content class="mt-20">

        <!-- Totais -->
        <div class="form-grid">
          <div class="col-3 md-12">
            <mat-form-field class="full-width">
              <mat-label>Total Isolado</mat-label>
              <input matInput type="number" formControlName="areaTotalIsolado">
            </mat-form-field>
          </div>
          <div class="col-3 md-12">
            <mat-form-field class="full-width">
              <mat-label>Total Consórcio</mat-label>
              <input matInput type="number" formControlName="areaTotalConsorcio">
            </mat-form-field>
          </div>
          <div class="col-3 md-12">
            <mat-form-field class="full-width">
              <mat-label>Total Rotação</mat-label>
              <input matInput type="number" formControlName="areaTotalRotacao">
            </mat-form-field>
          </div>
        </div>

        <mat-accordion multi>
          <mat-expansion-panel *ngFor="let g of grupos">
            <mat-expansion-panel-header>
              <mat-panel-title>{{ g.title }}</mat-panel-title>
            </mat-expansion-panel-header>

            <div class="panel-actions">
              <button mat-stroked-button color="primary" type="button" (click)="addItem(g.code)">
                <mat-icon fontIcon="add"></mat-icon>
                Adicionar
              </button>
            </div>

            <ng-container *ngIf="itensDoGrupo(g.code)?.length; else vazio">
              <mat-list class="item-list">
                <mat-list-item *ngFor="let it of itensDoGrupo(g.code); trackBy: trackItem" (click)="clickItem(it)">
                  <mat-icon matListItemIcon fontIcon="article"></mat-icon>
                  <div matListItemTitle>
                    {{ buildMeta(it).label || 'Item' }}
                  </div>
                  <div matListItemLine>
                    Área:
                    {{ areaOf(it) | number:'1.4-4' }}
                  </div>

                  <button
                    mat-icon-button
                    color="warn"
                    matListItemMeta
                    (click)="removerItem(it, $event)">
                    <mat-icon fontIcon="delete_forever"></mat-icon>
                  </button>
                </mat-list-item>
              </mat-list>
            </ng-container>

            <ng-template #vazio>
              <div class="hint">Nenhum item adicionado.</div>
            </ng-template>
          </mat-expansion-panel>
        </mat-accordion>

      </mat-card-content>

      <mat-card-actions>
        <button mat-flat-button color="primary" type="submit">
          <mat-icon [fontIcon]="atualizando ? 'refresh' : 'save'"></mat-icon>
          {{ atualizando ? 'Atualizar' : 'Salvar' }}
        </button>
      </mat-card-actions>
    </mat-card>
  </form>
</div>
